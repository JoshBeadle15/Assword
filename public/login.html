<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Villa Vault</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23201712'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='26' fill='%23d9a441' text-anchor='middle'%3EMV%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="gate">
  <main class="gate-card">
    <div class="brand">
      <span class="brand-mark">MV</span>
      <h1>Music Villa Vault</h1>
      <p class="tagline">Store credentials, kept behind one door.</p>
    </div>
    <form id="login-form" autocomplete="off">
      <label for="password">Vault Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Enter Vault</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
