<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Villa Vault</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23201712'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='26' fill='%23d9a441' text-anchor='middle'%3EMV%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-inline">
      <span class="brand-mark">MV</span>
      <h1>Music Villa Vault</h1>
    </div>
    <div class="topbar-actions">
      <button id="add-btn" class="btn btn-primary">+ Add Site</button>
      <button id="logout-btn" class="btn btn-ghost">Log out</button>
    </div>
  </header>

  <main class="container">
    <div class="table-card">
      <table id="entries-table">
        <thead>
          <tr>
            <th>Site</th>
            <th>Password</th>
            <th>Last Updated</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="entries-body">
          <tr class="empty-row"><td colspan="4">Loading&hellip;</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Add / Edit modal -->
  <div id="entry-modal" class="modal-backdrop" hidden>
    <form id="entry-form" class="modal-card">
      <h2 id="modal-title">Add Site</h2>
      <input type="hidden" id="entry-id" />

      <label for="entry-site">Site</label>
      <input id="entry-site" required autocomplete="off" />

      <label for="entry-password">Password</label>
      <input id="entry-password" required autocomplete="off" />

      <label for="entry-name">Your Name</label>
      <input id="entry-name" required autocomplete="off" placeholder="So we know who made this change" />

      <p id="modal-error" class="error" hidden></p>

      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
